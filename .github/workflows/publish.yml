name: Publish website
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Pages to publish
        type: choice
        default: landing
        options: [landing, full]
        required: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 build-pages.py
      - run: git diff --exit-code -- dist/
      - name: Prepare selected pages
        env:
          PUBLISH_SCOPE: ${{ inputs.scope }}
        run: python3 scripts/prepare-site.py --scope "$PUBLISH_SCOPE"
      - name: Check publication readiness
        env:
          PUBLISH_SCOPE: ${{ inputs.scope }}
        run: python3 scripts/check-site.py --publish --directory _site --scope "$PUBLISH_SCOPE"
      - run: node --check dist/site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
